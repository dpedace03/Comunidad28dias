<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Subida Directa a GitHub</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            background-color: #f4f6f8;
        }
        .upload-card {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input[type="file"], input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-github {
            width: 100%;
            padding: 10px;
            background-color: #2da44e;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-github:hover { background-color: #2c974b; }
        .btn-github:disabled { background-color: #94d3a2; cursor: not-allowed; }
        .btn-token {
            background-color: #6e7681;
            margin-top: 5px;
        }
        .btn-token:hover { background-color: #57606a; }
        .status-msg {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="upload-card">
        <h2>Prueba de Subida a GitHub</h2>
        
        <!-- 1. Selección de archivo -->
        <div class="form-group">
            <label for="fileInput">Selecciona un archivo local:</label>
            <input type="file" id="fileInput">
        </div>

        <!-- 2. Nombre/Ruta de destino en el repositorio -->
        <div class="form-group">
            <label for="githubPath">Nombre del archivo en GitHub (ej: config.json o prueba.txt):</label>
            <input type="text" id="githubPath" value="config.json">
        </div>

        <!-- Botones de Acción -->
        <button id="btnSubir" class="btn-github" onclick="subirArchivoSeleccionado()">
            🚀 Subir Archivo Seleccionado a GitHub
        </button>

        <button class="btn-github btn-token" onclick="cambiarTokenGitHub()">
            🔑 Configurar / Cambiar Token
        </button>

        <div id="status" class="status-msg"></div>
    </div>

    <script>
        const STORAGE_TOKEN_KEY = "github_pat_comunidad28dias";
        const OWNER = "dpedace03";
        const REPO = "Comunidad28dias";

        function obtenerTokenGitHub() {
            let token = localStorage.getItem(STORAGE_TOKEN_KEY);
            if (!token) {
                token = prompt("Por favor, ingresa tu GitHub Personal Access Token (PAT):");
                if (token && token.trim() !== "") {
                    token = token.trim();
                    localStorage.setItem(STORAGE_TOKEN_KEY, token);
                } else {
                    alert("Se requiere un Token válido para operar.");
                    return null;
                }
            }
            return token;
        }

        function cambiarTokenGitHub() {
            const tokenActual = localStorage.getItem(STORAGE_TOKEN_KEY);
            const nuevoToken = prompt("Ingresa el nuevo GitHub Token:", tokenActual || "");
            if (nuevoToken === null) return;

            if (nuevoToken.trim() === "") {
                localStorage.removeItem(STORAGE_TOKEN_KEY);
                alert("Token eliminado.");
            } else {
                localStorage.setItem(STORAGE_TOKEN_KEY, nuevoToken.trim());
                alert("Token guardado.");
            }
        }

        async function subirArchivoSeleccionado() {
            const fileInput = document.getElementById("fileInput");
            const pathInput = document.getElementById("githubPath").value.trim();
            const statusDiv = document.getElementById("status");

            if (fileInput.files.length === 0) {
                alert("Por favor selecciona un archivo primero.");
                return;
            }

            if (!pathInput) {
                alert("Por favor ingresa el nombre de destino para GitHub.");
                return;
            }

            const token = obtenerTokenGitHub();
            if (!token) return;

            const file = fileInput.files[0];
            const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${pathInput}`;

            statusDiv.style.color = "#333";
            statusDiv.innerText = "⏳ Leyendo archivo...";

            // Leer el archivo local seleccionado
            const reader = new FileReader();

            reader.onload = async function (e) {
                try {
                    // Convertir el contenido del archivo a Base64
                    const arrayBuffer = e.target.result;
                    const bytes = new Uint8Array(arrayBuffer);
                    let binary = '';
                    for (let i = 0; i < bytes.byteLength; i++) {
                        binary += String.fromCharCode(bytes[i]);
                    }
                    const contentBase64 = btoa(binary);

                    statusDiv.innerText = "⏳ Verificando repositorio en GitHub...";

                    // 1. Obtener SHA previo si el archivo ya existe en GitHub
                    const getRes = await fetch(url, {
                        headers: {
                            "Authorization": `token ${token}`,
                            "Accept": "application/vnd.github.v3+json"
                        }
                    });

                    let sha = "";
                    if (getRes.ok) {
                        const fileData = await getRes.json();
                        sha = fileData.sha;
                    } else if (getRes.status === 401) {
                        alert("Token inválido o expirado. Vuelve a configurarlo.");
                        localStorage.removeItem(STORAGE_TOKEN_KEY);
                        statusDiv.innerText = "";
                        return;
                    }

                    statusDiv.innerText = "🚀 Subiendo a GitHub...";

                    // 2. Enviar petición PUT a GitHub
                    const putRes = await fetch(url, {
                        method: "PUT",
                        headers: {
                            "Authorization": `token ${token}`,
                            "Content-Type": "application/json",
                            "Accept": "application/vnd.github.v3+json"
                        },
                        body: JSON.stringify({
                            message: `Subida de ${pathInput} desde prueba HTML`,
                            content: contentBase64,
                            sha: sha !== "" ? sha : undefined
                        })
                    });

                    if (putRes.ok) {
                        statusDiv.style.color = "green";
                        statusDiv.innerText = `✅ ¡Archivo '${pathInput}' subido exitosamente a GitHub!`;
                    } else {
                        const errData = await putRes.json();
                        statusDiv.style.color = "red";
                        statusDiv.innerText = "❌ Error: " + (errData.message || putRes.statusText);
                    }

                } catch (err) {
                    console.error(err);
                    statusDiv.style.color = "red";
                    statusDiv.innerText = "❌ Error en el proceso de subida.";
                }
            };

            // Ejecutar lectura como ArrayBuffer para admitir texto o archivos binarios
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
